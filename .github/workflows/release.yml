name: Release

# Builds the installers (roadmap Phase 7). Runs by hand (Actions → Release → Run workflow), on
# any push that changes how the app is packaged (so packaging breaks show up before a release),
# or on a tag like v0.1.0, which also makes a draft GitHub release with the files attached.
#
# Neither build contains the AI engine: each carries engine-manifest.json, made here from the
# llama.cpp release pinned in engine-version.txt (URLs, sizes, SHA-256s), and the app downloads
# and checks those files on first use: the CUDA build on Windows (P7-T3), the Vulkan build on
# Linux (P8-T1).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # branch pushes only when packaging changed (path filters don't apply to tags)
    branches: ["**"]
    paths:
      - .github/workflows/release.yml
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/windows/**
      - engine-version.txt

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Engine manifest from the pinned llama.cpp release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = (Get-Content engine-version.txt -Raw).Trim()
          $assets = gh release view $tag -R ggml-org/llama.cpp --json assets -q '.assets[].name'
          # the CUDA 12 build of the server, and the CUDA 12 runtime it needs
          $server = $assets | Where-Object { $_ -match "^llama-$tag-bin-win-cuda-12[.0-9]*-x64\.zip$" } | Sort-Object | Select-Object -Last 1
          if (-not $server) { throw "no CUDA 12 Windows build in llama.cpp $tag" }
          $cuda = ($server -replace "^llama-$tag-bin-win-cuda-", '') -replace '-x64\.zip$', ''
          $runtime = $assets | Where-Object { $_ -eq "cudart-llama-bin-win-cuda-$cuda-x64.zip" } | Select-Object -First 1
          if (-not $runtime) { throw "no CUDA runtime $cuda in llama.cpp $tag" }
          $files = @()
          foreach ($name in @($server, $runtime)) {
            gh release download $tag -R ggml-org/llama.cpp -p $name -D engine-dl
            $path = Join-Path engine-dl $name
            $files += [ordered]@{
              url    = "https://github.com/ggml-org/llama.cpp/releases/download/$tag/$name"
              sha256 = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
              size   = (Get-Item $path).Length
            }
          }
          [ordered]@{ tag = $tag; files = $files } | ConvertTo-Json -Depth 4 | Set-Content apps/desktop/src-tauri/engine-manifest.json -Encoding utf8
          Get-Content apps/desktop/src-tauri/engine-manifest.json

      - name: Build
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: target/release/bundle/nsis/*.exe

  ubuntu:
    name: Ubuntu packages (.deb, AppImage)
    # 22.04 so the packages also run on 24.04 (older glibc)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file
      # Linux hosts (P8-T1): the Vulkan build of llama-server, which also runs on the processor
      # when there's no usable GPU. Downloaded by the app the first time sharing is switched on.
      - name: Engine manifest from the pinned llama.cpp release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(tr -d '[:space:]' < engine-version.txt)
          name="llama-$tag-bin-ubuntu-vulkan-x64.tar.gz"
          gh release download "$tag" -R ggml-org/llama.cpp -p "$name" -D engine-dl
          path="engine-dl/$name"
          # the archive must hold llama-server, or the app would download it for nothing
          tar -tzf "$path" | grep -q '/llama-server$' || { echo "no llama-server in $name"; exit 1; }
          jq -n --arg tag "$tag" \
                --arg url "https://github.com/ggml-org/llama.cpp/releases/download/$tag/$name" \
                --arg sha "$(sha256sum "$path" | cut -d' ' -f1)" \
                --argjson size "$(stat -c %s "$path")" \
                '{tag: $tag, files: [{url: $url, sha256: $sha, size: $size}]}' \
            > apps/desktop/src-tauri/engine-manifest.json
          cat apps/desktop/src-tauri/engine-manifest.json
      - name: Build
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --bundles deb,appimage
      # The bundled 22.04 libwayland breaks EGL with newer Mesa (blank window on Ubuntu 26.04,
      # "Could not create default EGL display: EGL_BAD_PARAMETER"). Every Linux desktop ships
      # libwayland, so drop ours and use the system's.
      - name: Remove bundled Wayland libraries from the AppImage
        working-directory: target/release/bundle/appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          wget -q -O /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          for app in *.AppImage; do
            ./"$app" --appimage-extract >/dev/null
            rm -v squashfs-root/usr/lib/libwayland-*.so*
            rm "$app"
            ARCH=x86_64 /tmp/appimagetool squashfs-root "$app"
            rm -rf squashfs-root
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-packages
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  publish:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, ubuntu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --generate-notes \
            dist/windows-installer/*.exe dist/ubuntu-packages/deb/*.deb dist/ubuntu-packages/appimage/*.AppImage
