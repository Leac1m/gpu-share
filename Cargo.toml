[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/netcore",
    "crates/host",
    "crates/client",
    "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
thiserror = "2"
anyhow = "1"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util", "fs"] }
futures-util = "0.3"
bytes = "1"
# TLS: rustls with the ring provider everywhere. aws-lc-rs needs extra build tools on Windows.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream", "json"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "service"] }
tower = { version = "0.5", features = ["util"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
proptest = "1"
protocol = { path = "crates/protocol" }
netcore = { path = "crates/netcore" }
host = { path = "crates/host" }
client = { path = "crates/client" }
